name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          # 4.0 is covered by coverage-measure.yml (test) and
          # rubocop-pr.yml (lint) — keep this list to the non-coverage
          # Rubies so nothing runs twice.
          - '3.4'
          - '3.3'
          - '3.2'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
